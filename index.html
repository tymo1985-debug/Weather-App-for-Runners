<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Run Weather</title>
<meta name="description" content="Weather with a running score: the best window of the day, factor breakdown, air quality and pollen.">
<meta name="theme-color" content="#4A9FE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Run Weather">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">

<!-- 1 - ГЛАВНАЯ -->
<section class="screen is-active screen--home" data-screen="home">
  <header class="hero home-hero">
    <div class="hero__sky"></div>
    <div class="hero__scene" aria-hidden="true"></div>

    <div class="hero__top safe-top">
      <div>
        <button class="hero__place" id="btnPlace">
          <span class="hero__pin" id="pinIcon"></span>
          <span id="placeName">...</span>
          <svg viewBox="0 0 24 24" class="i12 chev"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <p class="hero__date" id="heroDate">&nbsp;</p>
      </div>
    </div>

    <div class="home-hero__status">
      <span class="home-hero__runner" id="scoreRunIc"></span>
      <span id="scoreHeadLbl"></span>
    </div>

    <button class="home-score" id="cardScore" type="button">
      <span class="home-score__ring" aria-hidden="true"></span>
      <span class="home-score__value" id="scoreBig">—</span>
    </button>

    <div class="home-hero__bottom">
      <div class="home-hero__temp"><span id="heroTemp">—</span><span>°</span></div>
      <div class="home-hero__summary" id="homeConditions">—</div>
    </div>

    <div class="home-hidden-data" aria-hidden="true">
      <span id="heroIcon"></span><span id="heroCond"></span><span id="heroFeels"></span><span id="heroMinMax"></span>
    </div>
  </header>

  <div class="home-sheet">
    <section class="home-today" aria-labelledby="homeTodayLabel">
      <div class="home-today__head">
        <h2 id="homeTodayLabel"></h2>
        <span class="home-best-badge" id="homeBestBadge"></span>
      </div>
      <div class="home-timeline" id="homeTimeline"></div>
    </section>

    <section class="home-metrics" aria-label="Current running weather">
      <div class="home-metric">
        <span class="home-metric__icon" id="homeFeelsIcon"></span>
        <div><b id="homeFeelsValue">—</b><span id="homeFeelsLabel"></span></div>
      </div>
      <div class="home-metric">
        <span class="home-metric__icon" id="homeWindIcon"></span>
        <div><b id="homeWindValue">—</b><span id="homeWindLabel"></span></div>
      </div>
      <div class="home-metric">
        <span class="home-metric__icon" id="homeRainIcon"></span>
        <div><b id="homeRainValue">—</b><span id="homeRainLabel"></span></div>
      </div>
    </section>

    <section class="home-advice">
      <span class="home-advice__icon" id="homeAdviceIcon"></span>
      <p id="homeAdvice"></p>
    </section>

    <button class="home-details" type="button" data-go="run-details">
      <span id="homeDetailsLabel"></span>
      <svg viewBox="0 0 24 24" class="i20" aria-hidden="true"><path d="M9 5l7 7-7 7z"/></svg>
    </button>

    <div class="updated home-updated" id="updatedAt"></div>
    <div class="visually-hidden" id="recommendationStatus" role="status" aria-live="polite" aria-atomic="true"></div>

    <div class="home-legacy" hidden aria-hidden="true">
      <span id="scoreLabel"></span><span id="scoreSub"></span><span id="scoreWhy"></span>
      <span id="lblViewDetails"></span>
      <span id="lblBestTime"></span><span id="factWindow"></span>
      <span id="lblDuration"></span><span id="factDuration"></span>
      <span id="lblUv"></span><span id="factUv"></span>
      <span id="icBest"></span><span id="icDur"></span><span id="icUv"></span>
      <p id="runScenario"></p>
      <div class="run-mini" id="runMiniTimeline"></div>
      <div class="routewx" id="routeWeatherHome" hidden></div>
      <div class="near-term">
        <div class="near-term__top"><span id="nearTermLabel"></span>
          <div class="near-term__choices">
            <button type="button" data-horizon="1">1 h</button>
            <button type="button" data-horizon="2">2 h</button>
          </div>
        </div>
        <div id="nearTermAdvice" class="near-term__advice"></div>
        <p id="runAdvice" class="near-term__tip" hidden></p>
      </div>
      <button class="run-log" id="logRunFeedback" type="button"></button>
      <div class="segmented">
        <button class="seg is-on" data-range="hours"></button>
        <button class="seg" data-range="today"></button>
        <button class="seg" data-range="days"></button>
      </div>
      <div class="hstrip" id="strip"></div>
    </div>

  </div>
</section>

<!-- 2 - ПОЧАСОВОЙ -->
<section class="screen" data-screen="hourly">
  <header class="topbar topbar--sky topbar--left safe-top">
    <button class="iconbtn" data-back></button>
    <div class="topbar__lead"><b id="hourlyCity">—</b><span id="hourlyDate"></span></div>
  </header>
  <div class="sheet sheet--flat">
    <div class="table">
      <div class="thead" id="hourlyHead"></div>
      <div id="hourlyRows"></div>
    </div>
    <div class="windowcard" id="windowCard"></div>
  </div>
</section>

<!-- 3 - 10 ДНЕЙ -->
<section class="screen" data-screen="daily">
  <div class="sheet sheet--flat safe-top">
    <h1 class="bigtitle" id="dailyTitle"></h1>
    <div class="utabs">
      <button class="utab" data-dcol="temp"></button>
      <button class="utab" data-dcol="precip"></button>
      <button class="utab is-on" data-dcol="score"></button>
    </div>
    <div class="table">
      <div class="thead thead--daily" id="dailyHead"></div>
      <div id="dailyRows"></div>
    </div>
  </div>
</section>

<!-- 4 - ОБЗОР УСЛОВИЙ -->
<section class="screen" data-screen="analysis">
  <header class="topbar topbar--sky safe-top">
    <button class="iconbtn" data-back></button>
    <div class="topbar__title"><b id="analysisTitle"></b></div>
    <button class="iconbtn" data-share></button>
  </header>
  <div class="sheet sheet--flat">
    <div class="card overview">
      <div class="overview__ring" id="ringWrap"></div>
      <ul class="overview__list" id="analysisChecks"></ul>
    </div>
    <div class="card">
      <h3 class="card__h" id="dayChartTitle"></h3>
      <div id="dayChart"></div>
    </div>
    <div class="notecard" id="analysisNote"></div>
  </div>
</section>

<!-- 5 - ПОЧЕМУ СЕЙЧАС ХОРОШО -->
<section class="screen" data-screen="why">
  <header class="topbar safe-top">
    <button class="iconbtn" data-back></button>
    <span class="topbar__spacer"></span>
    <button class="iconbtn" data-share></button>
  </header>
  <div class="sheet sheet--flat">
    <h1 class="bigtitle bigtitle--tight" id="whyTitle"></h1>
    <div class="whyring" id="whyRing"></div>
    <p class="whycap" id="whyCap"></p>
    <div class="utabs utabs--center">
      <button class="utab is-on" data-btab="score"></button>
      <button class="utab" data-btab="good"></button>
    </div>
    <div class="table table--flush" id="breakdown"></div>
    <button class="linkcard" data-go="timeline">
      <span class="linkcard__ic" id="tlLinkIc"></span>
      <span class="linkcard__txt"><small id="tlLinkK"></small><b id="tlLinkV"></b></span>
      <svg viewBox="0 0 24 24" class="i18 c-blue"><path d="M13 5l7 7-7 7-1.4-1.4 4.6-4.6H4v-2h12.2L11.6 6.4z"/></svg>
    </button>
  </div>
</section>

<!-- 6 - РАЗБОР ФАКТОРА -->
<section class="screen" data-screen="factor">
  <header class="topbar safe-top">
    <button class="iconbtn" data-back></button>
    <span class="topbar__spacer"></span>
    <button class="iconbtn" data-share></button>
  </header>
  <div class="sheet sheet--flat" id="factorBody"></div>
</section>

<!-- 7 - ТАЙМЛАЙН -->
<section class="screen" data-screen="timeline">
  <header class="topbar safe-top">
    <button class="iconbtn" data-back></button>
    <span class="topbar__spacer"></span>
    <button class="iconbtn" data-share></button>
  </header>
  <div class="sheet sheet--flat">
    <div class="card">
      <h3 class="card__h card__h--lg" id="tlTitle"></h3>
      <div id="tlChart"></div>
      <div id="tlList"></div>
      <button class="linkcard linkcard--inset" data-go="details">
        <span class="linkcard__ic" id="tlOptIc"></span>
        <span class="linkcard__txt"><small id="tlOptK"></small><b id="tlOptV"></b></span>
        <svg viewBox="0 0 24 24" class="i18 c-blue"><path d="M13 5l7 7-7 7-1.4-1.4 4.6-4.6H4v-2h12.2L11.6 6.4z"/></svg>
      </button>
    </div>
  </div>
</section>

<!-- 8 - ВОЗДУХ И ПЫЛЬЦА -->
<section class="screen" data-screen="air">
  <header class="topbar safe-top">
    <button class="iconbtn" data-back></button>
    <span class="topbar__spacer"></span>
    <span class="topbar__spacer"></span>
  </header>
  <div class="sheet sheet--flat">
    <div class="card" id="aqiCard"></div>
    <div class="card" id="pollenCard"></div>
  </div>
</section>

<!-- 9 - ПОГОДА / WEATHER HUB -->
<section class="screen screen--weather" data-screen="radar">
  <div class="weather-hub">
    <header class="weather-hero safe-top" id="weatherHero">
      <div class="weather-hero__backdrop"></div>
      <div class="weather-hero__shade"></div>
      <div class="weather-hero__top">
        <button class="weather-hero__place" id="weatherPlace" type="button">
          <span class="weather-hero__pin" id="weatherPlacePin"></span>
          <span id="weatherPlaceName">—</span>
          <svg viewBox="0 0 24 24" class="i14 chev" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
      </div>
      <p class="weather-hero__date" id="weatherHeroDate">&nbsp;</p>
      <div class="weather-hero__now">
        <div class="weather-hero__icon" id="weatherHeroIcon"></div>
        <div class="weather-hero__temp"><span id="weatherHeroTemp">—</span><span>°</span></div>
        <div class="weather-hero__copy">
          <b id="weatherHeroCond"></b>
          <span id="weatherHeroFeels"></span>
        </div>
      </div>
      <div class="weather-hero__minmax" id="weatherHeroMinMax"></div>
    </header>

    <button class="weather-run-score" id="weatherRunScore" type="button" data-go="home">
      <span class="weather-run-score__ic" id="weatherRunIcon"></span>
      <span class="weather-run-score__copy"><small id="weatherRunTitle"></small><b><span id="weatherRunValue">—</span><em>/100</em></b><span id="weatherRunBand"></span></span>
      <span class="weather-run-score__action" id="weatherRunAction"></span>
      <svg viewBox="0 0 24 24" class="i18" aria-hidden="true"><path d="M9 5l7 7-7 7z"/></svg>
    </button>

    <div class="weather-hub-tabs" role="tablist" aria-label="Weather sections">
      <button type="button" class="is-on" data-weather-section="radar" aria-selected="true"></button>
      <button type="button" data-weather-section="hourly" aria-selected="false"></button>
      <button type="button" data-weather-section="forecast" aria-selected="false"></button>
    </div>

    <div class="weather-hub__body">
      <section class="weather-card weather-panel" data-weather-panel="hourly">
        <div class="weather-card__head">
          <b id="weatherHourlyTitle"></b>
          <button class="weather-card__link" type="button" data-go="hourly"><span id="weatherHourlyMore"></span><svg viewBox="0 0 24 24" class="i14"><path d="M13 5l7 7-7 7-1.4-1.4 4.6-4.6H4v-2h12.2L11.6 6.4z"/></svg></button>
        </div>
        <div class="weather-hourly-mode" role="group" aria-label="Hourly weather view">
          <button type="button" data-weather-mode="cards" class="is-on" aria-pressed="true"></button>
          <button type="button" data-weather-mode="graph" aria-pressed="false"></button>
        </div>
        <div id="weatherHourly" class="weather-hourly"></div>
      </section>

      <section class="weather-card weather-radar-card weather-panel" id="weatherRadarCard" data-weather-panel="radar">
        <div class="weather-card__head weather-radar-card__head">
          <div><b id="weatherRadarTitle"></b><small id="weatherRadarSubtitle"></small></div>
          <button class="weather-card__action weather-radar-expand" id="weatherRadarExpand" type="button"></button>
        </div>
        <div class="weather-radar__map">
          <div id="map"></div>
          <div class="mapstate" id="mapState" role="status" aria-live="polite" hidden></div>
          <div class="visually-hidden" id="radarStatus" role="status" aria-live="polite"></div>
          <div class="radar-model-badge" id="radarModelBadge" hidden></div>
          <div class="mapchip">
            <span class="mapchip__pin" id="mapPin"></span>
            <span class="mapchip__city" id="mapCity">—</span>
            <button class="mapchip__live" id="mapLive"></button>
          </div>
          <div class="mapctl">
            <button class="mapbtn" id="btnLayers" aria-expanded="false"></button>
            <button class="mapbtn" id="btnMapLocate"></button>
            <div class="mapzoom"><button id="btnZoomIn"></button><button id="btnZoomOut"></button></div>
          </div>
          <div class="map-layer-menu" id="mapLayerMenu" hidden>
            <div class="map-layer-menu__title" id="mapLayerTitle"></div>
            <button type="button" data-map-layer="0"><span class="map-layer-swatch is-standard"></span><span id="mapLayerStandard"></span></button>
            <button type="button" data-map-layer="1"><span class="map-layer-swatch is-light"></span><span id="mapLayerLight"></span></button>
            <button type="button" data-map-layer="2"><span class="map-layer-swatch is-dark"></span><span id="mapLayerDark"></span></button>
          </div>
          <div class="radarpanel">
            <div class="radarpanel__row">
              <button class="radar__play" id="radarPlay" disabled></button>
              <span class="radar__now" id="radarLabel">—</span>
              <input type="range" id="radarTime" min="0" max="0" value="0" disabled>
            </div>
            <div class="radar__forecast-state" id="radarForecastState" aria-live="polite"></div>
            <div class="radar__ticks" id="radarTicks"></div>
            <div class="radar__grad"></div>
            <div class="radar__legend" id="radarLegend"></div>
          </div>
        </div>
        <div class="radar-quick" id="radarQuick" role="group">
          <div class="radar-quick__choices">
            <button type="button" data-radar-offset="0"></button>
            <button type="button" data-radar-offset="30" disabled></button>
            <button type="button" data-radar-offset="60" disabled></button>
            <button type="button" data-radar-offset="180" disabled></button>
            <button type="button" data-radar-offset="360" disabled></button>
          </div>
          <small class="radar-quick__status" id="radarQuickStatus" aria-live="polite"></small>
        </div>
      </section>

      <section class="weather-card weather-now-card weather-panel" data-weather-panel="radar">
        <div class="weather-card__head"><b id="weatherNowTitle"></b></div>
        <div class="weather-now">
          <div class="weather-now__main"><span id="weatherNowIcon"></span><b id="weatherNowTemp">—</b><small id="weatherNowFeels"></small></div>
          <div class="weather-now__metric"><span id="weatherNowWindIcon"></span><b id="weatherNowWind">—</b><small id="weatherNowWindLabel"></small></div>
          <div class="weather-now__metric"><span id="weatherNowRainIcon"></span><b id="weatherNowRain">—</b><small id="weatherNowRainLabel"></small></div>
        </div>
        <div class="weather-now-chart" id="weatherNowChart"></div>
      </section>

      <section class="weather-card weather-panel" data-weather-panel="forecast">
        <div class="weather-card__head">
          <b id="weatherDailyTitle"></b>
          <button class="weather-card__link" type="button" data-go="daily"><span id="weatherDailyMore"></span><svg viewBox="0 0 24 24" class="i14"><path d="M13 5l7 7-7 7-1.4-1.4 4.6-4.6H4v-2h12.2L11.6 6.4z"/></svg></button>
        </div>
        <div id="weatherDaily" class="weather-daily"></div>
      </section>

      <section class="weather-card weather-air-card weather-panel" data-weather-panel="radar">
        <div class="weather-card__head">
          <b id="weatherAirTitle"></b>
          <button class="weather-card__link weather-card__link--icon" type="button" data-go="air" aria-label="Air and pollen details"><svg viewBox="0 0 24 24" class="i18"><path d="M9 5l7 7-7 7z"/></svg></button>
        </div>
        <div id="weatherAir" class="weather-air"></div>
      </section>
    </div>
  </div>
</section>

<!-- 10 - СТАТИСТИКА -->
<section class="screen screen--stats" data-screen="stats">
  <div class="stats-page safe-top">
    <h1 id="statsTitle"></h1>
    <div class="stats-period">
      <button type="button" id="statsPrev" aria-label="Previous period">‹</button>
      <b id="statsPeriodLabel"></b>
      <button type="button" id="statsNext" aria-label="Next period">›</button>
    </div>
    <div class="stats-tabs" role="tablist">
      <button type="button" class="is-on" data-stats-tab="score"></button>
      <button type="button" data-stats-tab="weather"></button>
      <button type="button" data-stats-tab="runs"></button>
    </div>
    <section class="stats-card" id="statsOverviewCard">
      <small id="statsAverageLabel"></small>
      <div class="stats-average"><b id="statsAverage">—</b><span id="statsTrend"></span></div>
      <div class="stats-bars" id="statsBars"></div>
    </section>
    <section class="stats-card stats-best" id="statsBestCard">
      <b id="statsBestTitle"></b>
      <div class="stats-best__value"><span id="statsBestIcon"></span><strong id="statsBestValue">—</strong></div>
      <small id="statsBestSub"></small>
    </section>
    <section class="stats-card" id="statsConditionsCard">
      <b id="statsConditionsTitle"></b>
      <div class="stats-conditions" id="statsConditions"></div>
    </section>
    <section class="stats-card" id="statsHistoryCard">
      <div class="stats-card__head"><b id="statsHistoryTitle"></b><button type="button" id="statsHistoryAll"></button></div>
      <div class="stats-history" id="statsHistory"></div>
    </section>
  </div>
</section>

<!-- 11 - ПОДРОБНОСТИ ДЛЯ БЕГА -->
<section class="screen screen--run-details" data-screen="run-details">
  <header class="modal-top safe-top">
    <h1 id="runDetailsTitle"></h1>
    <button class="modal-close" type="button" data-back aria-label="Close">×</button>
  </header>
  <div class="run-details-page">
    <div class="run-details-tabs">
      <button type="button" class="is-on" data-run-details-range="now"></button>
      <button type="button" data-run-details-range="today"></button>
      <button type="button" data-run-details-range="tomorrow"></button>
    </div>
    <section class="run-details-score">
      <small>Run Score</small>
      <div class="run-details-score__row"><span id="runDetailsScore">—</span><b id="runDetailsBand"></b></div>
    </section>
    <section class="run-details-list" id="runDetailsList"></section>
    <button class="run-details-plan" type="button" data-go="planner"><span id="runDetailsPlanLabel"></span><span>›</span></button>
  </div>
</section>

<!-- 12 - ПЛАНИРОВЩИК -->
<section class="screen screen--planner" data-screen="planner">
  <header class="modal-top safe-top">
    <h1 id="plannerTitle"></h1>
    <button class="modal-close" type="button" data-back aria-label="Close">×</button>
  </header>
  <div class="planner-page">
    <div class="planner-tabs">
      <button type="button" class="is-on" data-planner-tab="best"></button>
      <button type="button" data-planner-tab="plan"></button>
    </div>
    <div class="planner-date">
      <button type="button" id="plannerPrev">‹</button><b id="plannerDate"></b><button type="button" id="plannerNext">›</button>
    </div>
    <div class="planner-slots" id="plannerSlots"></div>

    <div class="planner-controls">
      <div class="run-mode">
        <span id="runModeLabel"></span>
        <div class="run-mode__choices">
          <button type="button" data-run-mode="duration"></button>
          <button type="button" data-run-mode="distance"></button>
        </div>
      </div>

      <div class="duration-quick">
        <span id="quickDurationLabel"></span>
        <small class="duration-quick__hint" id="quickDurationHint"></small>
        <div class="duration-quick__choices">
          <button type="button" data-quick-duration="30">30</button>
          <button type="button" data-quick-duration="45">45</button>
          <button type="button" data-quick-duration="60">60</button>
          <button type="button" data-quick-duration="90">90</button>
          <button type="button" data-quick-duration="120">120</button>
        </div>
      </div>

      <div class="distance-plan" id="distancePlan" hidden>
        <div class="distance-plan__presets">
          <button type="button" data-distance="3">3 km</button>
          <button type="button" data-distance="5">5 km</button>
          <button type="button" data-distance="10">10 km</button>
          <button type="button" data-distance="15">15 km</button>
          <button type="button" data-distance="20">20 km</button>
        </div>
        <div class="distance-plan__inputs">
          <label><span id="distanceLabel"></span><input id="distanceKm" type="number" min="1" max="100" step="0.5"></label>
          <label><span id="paceLabel"></span><input id="paceInput" type="text"></label>
        </div>
        <div class="distance-plan__summary" id="distanceSummary"></div>
      </div>

      <div class="availability">
        <div class="availability__head"><span id="availabilityLabel"></span><button type="button" id="clearAvailability"></button></div>
        <div class="availability__inputs">
          <label><span id="availabilityFromLabel"></span><input id="availableFrom" type="time"></label>
          <label><span id="availabilityToLabel"></span><input id="availableTo" type="time"></label>
        </div>
        <div class="start-compare" id="startCompare"></div>
        <button class="watch-btn" id="watchBest" type="button"></button>
        <p class="watch-status" id="watchStatus" hidden></p>
      </div>
    </div>

    <button class="planner-calendar" id="plannerCalendar" type="button"><span id="plannerCalendarLabel"></span></button>
  </div>
</section>

<!-- 13 - ЕЩЁ -->
<section class="screen screen--more" data-screen="details">
  <div class="more-page safe-top">
    <h1 id="moreTitle"></h1>
    <div class="more-menu">
      <button class="more-row" type="button" data-go="planner"><span class="more-row__ic more-row__ic--blue" id="morePaceIcon"></span><span><b id="morePaceTitle"></b><small id="morePaceSub"></small></span><em>›</em></button>
      <button class="more-row" type="button" data-go="why"><span class="more-row__ic more-row__ic--blue" id="moreScoreIcon"></span><span><b id="moreScoreTitle"></b><small id="moreScoreSub"></small></span><em>›</em></button>
      <button class="more-row" type="button" data-go="planner"><span class="more-row__ic more-row__ic--amber" id="moreWatchIcon"></span><span><b id="moreWatchTitle"></b><small id="moreWatchSub"></small></span><em>›</em></button>
      <button class="more-row" type="button" data-go="cities"><span class="more-row__ic more-row__ic--amber" id="morePlacesIcon"></span><span><b id="morePlacesTitle"></b><small id="morePlacesSub"></small></span><em>›</em></button>
      <button class="more-row" type="button" id="moreSettingsRow"><span class="more-row__ic more-row__ic--blue" id="moreSettingsIcon"></span><span><b id="moreSettingsTitle"></b><small id="moreSettingsSub"></small></span><em>›</em></button>
      <button class="more-row" type="button" id="moreAboutRow"><span class="more-row__ic more-row__ic--blue" id="moreAboutIcon"></span><span><b id="moreAboutTitle"></b><small id="moreAboutSub"></small></span><em>›</em></button>
    </div>

    <div class="more-settings" id="moreSettingsPanel" hidden>
      <div class="more-settings__head"><b id="moreSettingsPanelTitle"></b><button type="button" id="moreSettingsClose">×</button></div>
      <div id="profileList"></div>
      <div class="chooser" id="langChooser"></div>
      <div class="more-route">
        <div class="more-route__head"><b id="routeTitle"></b><button type="button" class="route-clear" id="routeClear"></button></div>
        <label class="route-import" for="gpxFile" id="routeImportLabel"></label>
        <input id="gpxFile" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden>
        <div id="routeSummary" class="route-summary"></div>
        <div id="routeWeatherDetails" class="routewx routewx--details" aria-live="polite" hidden></div>
      </div>
    </div>

    <div class="more-about" id="moreAboutPanel" hidden>
      <div class="more-settings__head"><b id="moreAboutPanelTitle"></b><button type="button" id="moreAboutClose">×</button></div>
      <div class="app-update-card__head"><p id="appVersionMeta"></p><span class="app-update-card__badge" id="appVersionBadge"></span></div>
      <ul id="whatsNewList"></ul>
      <button class="btn btn--ghost" id="btnInstall" hidden></button>
      <p class="tagline" id="tagline"></p>
      <p class="fineprint" id="fineprint"></p>
    </div>

    <div class="more-legacy" hidden aria-hidden="true">
      <h3 id="detailsTitle"></h3><div id="detailsList"></div><div id="detailsLinks"></div>
      <h3 id="profileTitle"></h3>
      <h3 id="historyTitle"></h3><div id="historyList"></div>
      <h3 id="langTitle"></h3>
      <h3 id="appVersionTitle"></h3><b id="whatsNewTitle"></b>
    </div>
  </div>
</section>

<!-- ГОРОДА -->
<section class="screen" data-screen="cities">
  <header class="topbar safe-top">
    <button class="iconbtn" data-back></button>
    <div class="topbar__title"><b id="citiesTitle"></b></div>
    <span class="topbar__spacer"></span>
  </header>
  <div class="sheet sheet--flat">
    <label class="visually-hidden" for="cityQ" id="cityQLabel">Search city</label>
    <input class="searchbox" id="cityQ" autocomplete="off">
    <ul class="reslist" id="cityRes"></ul>
    <div class="card" id="cityList"></div>
  </div>
</section>

<nav class="tabbar safe-bottom">
  <button class="tab is-on" data-go="home"><span class="tab__ic" data-ic="runner"></span><span data-t="tabRun"></span></button>
  <button class="tab" data-go="radar"><span class="tab__ic" data-ic="globe"></span><span data-t="tabWeather"></span></button>
  <button class="tab" data-go="stats"><span class="tab__ic" data-ic="trend"></span><span data-t="tabStats"></span></button>
  <button class="tab" data-go="details"><span class="tab__ic" data-ic="more"></span><span data-t="tabMore"></span></button>
</nav>
</div>

<div class="datastate" id="dataState" role="status" aria-live="polite" hidden>
  <div class="datastate__box">
    <p id="dataStateMsg"></p>
    <button class="datastate__retry" id="dataRetry"></button>
  </div>
</div>

<div class="sheetover" id="sheetover" hidden>
  <div class="sheetover__back" data-close-sheet></div>
  <div class="sheetover__panel safe-bottom" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheetover__grab"></div><div id="sheetoverBody"></div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="js/app.js" type="module"></script>
</body>
</html>
