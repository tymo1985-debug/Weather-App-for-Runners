<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Run Weather</title>
<meta name="description" content="Weather with a running score: the best window of the day, factor breakdown, air quality and pollen.">
<meta name="theme-color" content="#4A9FE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Run Weather">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">

<!-- 1 - ГЛАВНАЯ -->
<section class="screen is-active" data-screen="home">
  <header class="hero">
    <div class="hero__sky"></div>
    <div class="hero__scene" aria-hidden="true"></div>
    <div class="hero__top safe-top">
      <div>
        <button class="hero__place" id="btnPlace">
          <span class="hero__pin" id="pinIcon"></span>
          <span id="placeName">...</span>
          <svg viewBox="0 0 24 24" class="i12 chev"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <p class="hero__date" id="heroDate">&nbsp;</p>
      </div>
      <div class="hero__actions">
        <button class="round-btn" id="btnLocate"></button>
        <button class="round-btn" id="btnAddCity"></button>
      </div>
    </div>
    <div class="hero__now">
      <div class="hero__icon" id="heroIcon"></div>
      <div class="hero__temp">
        <div class="hero__deg"><span id="heroTemp">—</span><span class="deg">°</span></div>
        <div class="hero__cond" id="heroCond"></div>
        <div class="hero__feels" id="heroFeels">&nbsp;</div>
      </div>
    </div>
    <div class="hero__minmax" id="heroMinMax"></div>
  </header>

  <div class="sheet">
    <div class="grid2">
      <button class="scorecard" id="cardScore">
        <div class="scorecard__head"><span class="scorecard__ic" id="scoreRunIc"></span><span id="scoreHeadLbl"></span></div>
        <div class="scorecard__value" id="scoreBig">—</div>
        <div class="scorecard__label"><svg viewBox="0 0 24 24" class="i16"><path d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6L20.1 8.4 18.7 7Z"/></svg><span id="scoreLabel"></span></div>
        <div class="scorecard__sub" id="scoreSub"></div>
      </button>

      <div class="factcard">
        <div class="fact"><span class="fact__ic" id="icBest"></span>
          <div><span class="fact__k" id="lblBestTime"></span><span class="fact__v" id="factWindow">—</span></div></div>
        <div class="fact"><span class="fact__ic" id="icDur"></span>
          <div><span class="fact__k" id="lblDuration"></span><span class="fact__v" id="factDuration">—</span></div></div>
        <div class="fact"><span class="fact__ic" id="icUv"></span>
          <div><span class="fact__k" id="lblUv"></span><span class="fact__v" id="factUv">—</span></div></div>
        <button class="linkrow" data-go="analysis"><span id="lblViewDetails"></span>
          <svg viewBox="0 0 24 24" class="i14"><path d="M13 5l7 7-7 7-1.4-1.4 4.6-4.6H4v-2h12.2L11.6 6.4z"/></svg></button>
      </div>
    </div>

    <div class="segmented" role="tablist">
      <button class="seg is-on" data-range="hours" role="tab"></button>
      <button class="seg" data-range="today" role="tab"></button>
      <button class="seg" data-range="days" role="tab"></button>
    </div>

    <div class="hstrip" id="strip"></div>
    <div class="updated" id="updatedAt"></div>
  </div>
</section>

<!-- 2 - ПОЧАСОВОЙ -->
<section class="screen" data-screen="hourly">
  <header class="topbar topbar--sky topbar--left safe-top">
    <button class="iconbtn" data-back></button>
    <div class="topbar__lead"><b id="hourlyCity">—</b><span id="hourlyDate"></span></div>
  </header>
  <div class="sheet sheet--flat">
    <div class="table">
      <div class="thead" id="hourlyHead"></div>
      <div id="hourlyRows"></div>
    </div>
    <div class="windowcard" id="windowCard"></div>
  </div>
</section>

<!-- 3 - 10 ДНЕЙ -->
<section class="screen" data-screen="daily">
  <div class="sheet sheet--flat safe-top">
    <h1 class="bigtitle" id="dailyTitle"></h1>
    <div class="utabs">
      <button class="utab" data-dcol="temp"></button>
      <button class="utab" data-dcol="precip"></button>
      <button class="utab is-on" data-dcol="score"></button>
    </div>
    <div class="table">
      <div class="thead thead--daily" id="dailyHead"></div>
      <div id="dailyRows"></div>
    </div>
  </div>
</section>

<!-- 4 - ОБЗОР УСЛОВИЙ -->
<section class="screen" data-screen="analysis">
  <header class="topbar topbar--sky safe-top">
    <button class="iconbtn" data-back></button>
    <div class="topbar__title"><b id="analysisTitle"></b></div>
    <button class="iconbtn" data-share></button>
  </header>
  <div class="sheet sheet--flat">
    <div class="card overview">
      <div class="overview__ring" id="ringWrap"></div>
      <ul class="overview__list" id="analysisChecks"></ul>
    </div>
    <div class="card">
      <h3 class="card__h" id="dayChartTitle"></h3>
      <div id="dayChart"></div>
    </div>
    <div class="notecard" id="analysisNote"></div>
  </div>
</section>

<!-- 5 - ПОЧЕМУ СЕЙЧАС ХОРОШО -->
<section class="screen" data-screen="why">
  <header class="topbar safe-top">
    <button class="iconbtn" data-back></button>
    <span class="topbar__spacer"></span>
    <button class="iconbtn" data-share></button>
  </header>
  <div class="sheet sheet--flat">
    <h1 class="bigtitle bigtitle--tight" id="whyTitle"></h1>
    <div class="whyring" id="whyRing"></div>
    <p class="whycap" id="whyCap"></p>
    <div class="utabs utabs--center">
      <button class="utab is-on" data-btab="score"></button>
      <button class="utab" data-btab="good"></button>
    </div>
    <div class="table table--flush" id="breakdown"></div>
    <button class="linkcard" data-go="timeline">
      <span class="linkcard__ic" id="tlLinkIc"></span>
      <span class="linkcard__txt"><small id="tlLinkK"></small><b id="tlLinkV"></b></span>
      <svg viewBox="0 0 24 24" class="i18 c-blue"><path d="M13 5l7 7-7 7-1.4-1.4 4.6-4.6H4v-2h12.2L11.6 6.4z"/></svg>
    </button>
  </div>
</section>

<!-- 6 - РАЗБОР ФАКТОРА -->
<section class="screen" data-screen="factor">
  <header class="topbar safe-top">
    <button class="iconbtn" data-back></button>
    <span class="topbar__spacer"></span>
    <button class="iconbtn" data-share></button>
  </header>
  <div class="sheet sheet--flat" id="factorBody"></div>
</section>

<!-- 7 - ТАЙМЛАЙН -->
<section class="screen" data-screen="timeline">
  <header class="topbar safe-top">
    <button class="iconbtn" data-back></button>
    <span class="topbar__spacer"></span>
    <button class="iconbtn" data-share></button>
  </header>
  <div class="sheet sheet--flat">
    <div class="card">
      <h3 class="card__h card__h--lg" id="tlTitle"></h3>
      <div id="tlChart"></div>
      <div id="tlList"></div>
      <button class="linkcard linkcard--inset" data-go="details">
        <span class="linkcard__ic" id="tlOptIc"></span>
        <span class="linkcard__txt"><small id="tlOptK"></small><b id="tlOptV"></b></span>
        <svg viewBox="0 0 24 24" class="i18 c-blue"><path d="M13 5l7 7-7 7-1.4-1.4 4.6-4.6H4v-2h12.2L11.6 6.4z"/></svg>
      </button>
    </div>
  </div>
</section>

<!-- 8 - ВОЗДУХ И ПЫЛЬЦА -->
<section class="screen" data-screen="air">
  <header class="topbar safe-top">
    <button class="iconbtn" data-back></button>
    <span class="topbar__spacer"></span>
    <span class="topbar__spacer"></span>
  </header>
  <div class="sheet sheet--flat">
    <div class="card" id="aqiCard"></div>
    <div class="card" id="pollenCard"></div>
  </div>
</section>

<!-- 9 - РАДАР -->
<section class="screen screen--map" data-screen="radar">
  <div id="map"></div>
  <div class="mapstate" id="mapState" hidden></div>
  <div class="mapchip safe-top">
    <span class="mapchip__pin" id="mapPin"></span>
    <span class="mapchip__city" id="mapCity">—</span>
    <button class="mapchip__live" id="mapLive"></button>
  </div>
  <div class="mapctl">
    <button class="mapbtn" id="btnLayers"></button>
    <button class="mapbtn" id="btnMapLocate"></button>
    <div class="mapzoom"><button id="btnZoomIn"></button><button id="btnZoomOut"></button></div>
  </div>
  <div class="radarpanel safe-bottom">
    <div class="radarpanel__row">
      <button class="radar__play" id="radarPlay"></button>
      <span class="radar__now" id="radarLabel">—</span>
      <input type="range" id="radarTime" min="0" max="0" value="0">
    </div>
    <div class="radar__ticks" id="radarTicks"></div>
    <div class="radar__grad"></div>
    <div class="radar__legend" id="radarLegend"></div>
  </div>
</section>

<!-- 10 - ДЕТАЛИ И НАСТРОЙКИ -->
<section class="screen" data-screen="details">
  <div class="sheet sheet--flat safe-top">
    <div class="card">
      <h3 class="card__h card__h--lg" id="detailsTitle"></h3>
      <div id="detailsList"></div>
      <div class="linkgroup" id="detailsLinks"></div>
    </div>
    <div class="card">
      <h3 class="card__h card__h--lg" id="profileTitle"></h3>
      <div id="profileList"></div>
    </div>
    <div class="card">
      <h3 class="card__h card__h--lg" id="langTitle"></h3>
      <div class="chooser" id="langChooser"></div>
    </div>
    <button class="btn btn--ghost" id="btnInstall" hidden></button>
    <p class="tagline" id="tagline"></p>
    <p class="fineprint" id="fineprint"></p>
  </div>
</section>

<!-- ГОРОДА -->
<section class="screen" data-screen="cities">
  <div class="sheet sheet--flat safe-top">
    <h1 class="bigtitle" id="citiesTitle"></h1>
    <input class="searchbox" id="cityQ" autocomplete="off">
    <ul class="reslist" id="cityRes"></ul>
    <div class="card" id="cityList"></div>
  </div>
</section>

<nav class="tabbar safe-bottom">
  <button class="tab is-on" data-go="home"><span class="tab__ic" data-ic="house"></span><span data-t="tabHome"></span></button>
  <button class="tab" data-go="radar"><span class="tab__ic" data-ic="globe"></span><span data-t="tabMap"></span></button>
  <button class="tab" data-go="cities"><span class="tab__ic" data-ic="star"></span><span data-t="tabFav"></span></button>
  <button class="tab" data-go="details"><span class="tab__ic" data-ic="person"></span><span data-t="tabProfile"></span></button>
</nav>
</div>

<div class="datastate" id="dataState" hidden>
  <div class="datastate__box">
    <p id="dataStateMsg"></p>
    <button class="datastate__retry" id="dataRetry"></button>
  </div>
</div>

<div class="sheetover" id="sheetover" hidden>
  <div class="sheetover__back" data-close-sheet></div>
  <div class="sheetover__panel safe-bottom"><div class="sheetover__grab"></div><div id="sheetoverBody"></div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="js/app.js" type="module"></script>
</body>
</html>
