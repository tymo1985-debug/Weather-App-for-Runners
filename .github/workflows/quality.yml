name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js sw.js; do node --check "$file"; done
      - name: Validate web manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Check whitespace in commit
        run: git diff --check HEAD^ HEAD
